services:
  back:
    build: ./back
    container_name: autopro_backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - .env
    environment:
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:3001
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}"

  front:
    build:
      context: ./front
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        - API_BACKEND_URL=http://back:${BACKEND_PORT:-8000}
    container_name: autopro_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      - API_BACKEND_URL=http://back:${BACKEND_PORT:-8000}
    depends_on:
      - back

  whatsapp-gateway:
    build: ./whatsapp-gateway
    container_name: autopro_whatsapp_gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - WHATSAPP_GATEWAY_TOKEN=${WHATSAPP_GATEWAY_TOKEN:-}
      - ADMIN_LOGIN=${ADMIN_LOGIN:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-super_secret}
    volumes:
      - whatsapp_sessions:/app/.wwebjs_auth

volumes:
  whatsapp_sessions:
